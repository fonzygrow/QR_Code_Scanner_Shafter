<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shafter Family Engagement Sign-in</title>

  <style>
    body {
      font-family: "Avenir", "Helvetica Neue", Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      background-color: #d9d9d9;
    }

    /* Header Branding */
    header {
      background-color: #4C843F;
      color: white;
      padding: 20px;
      font-size: 1.8em;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    #subheader {
      background-color: #5A1E5B;
      color: white;
      padding: 8px;
      font-size: 0.95em;
    }

    #qr-reader {
      width: 300px;
      margin: 20px auto;
      border: 4px solid #9CDCF8;
      border-radius: 10px;
      background: white;
    }

    #qr-result {
      margin-top: 20px;
      font-size: 1.2em;
      color: #5A1E5B;
      font-weight: 500;
    }

#qr-iframe {
  width: 100%;
  max-width: 800px;
  height: 700px; /* fixed height */
  margin: 20px auto;
  border: 4px solid #F0A028;
  border-radius: 10px;
  display: none;
}

    .button {
      margin-top: 15px;
      padding: 12px 22px;
      font-size: 1em;
      background-color: #F0A028;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .button:hover {
      background-color: #d98e1f;
    }

    #camera-select {
      margin-top: 15px;
      padding: 8px;
      font-size: 1em;
      border: 2px solid #5A1E5B;
      border-radius: 6px;
    }
  </style>
</head>

<body>

<header>Shafter Family Engagement</header>
<div id="subheader">Scan to Sign In</div>

<select id="camera-select"></select>

<div id="qr-reader"></div>
<div id="qr-result">Scanning...</div>

<button id="scan-again" class="button">Scan Again</button>
<button id="manual-sign-in" class="button">Manually Sign In</button>

<iframe id="qr-iframe" src=""></iframe>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

<script>
  const resultEl = document.getElementById('qr-result');
  const iframe = document.getElementById('qr-iframe');
  const scanAgainButton = document.getElementById('scan-again');
  const manualSignInButton = document.getElementById('manual-sign-in');
  const cameraSelect = document.getElementById('camera-select');
  const qrReader = new Html5Qrcode("qr-reader");

  let currentCameraId = null;

  /* 🔊 Beep Sound */
  function playBeep() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }

  const now = audioCtx.currentTime;

  // Create two notes (cheerful rising "ding-ding")
  const notes = [
    { freq: 660, time: 0 },     // E5
    { freq: 880, time: 0.12 }   // A5 (higher, happy lift)
  ];

  notes.forEach(note => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.type = "sine";
    osc.frequency.setValueAtTime(note.freq, now + note.time);

    // Smooth attack & decay (prevents harsh beep)
    gain.gain.setValueAtTime(0, now + note.time);
    gain.gain.linearRampToValueAtTime(0.15, now + note.time + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + note.time + 0.25);

    osc.start(now + note.time);
    osc.stop(now + note.time + 0.3);
  });
}

  function startScanner(cameraId) {
    qrReader.start(
      { deviceId: { exact: cameraId } },
      { fps: 10, qrbox: 250 },
      onScanSuccess
    ).catch(err => {
      resultEl.innerText = "Camera error or permission denied.";
      console.error(err);
    });

    resultEl.innerText = "Scanning...";
    iframe.style.display = "none";
    scanAgainButton.style.display = "none";
    manualSignInButton.style.display = "inline-block";
  }

  function onScanSuccess(decodedText) {
    playBeep(); // 🔊 SOUND ON SCAN

    resultEl.innerText = "Scanned!";
    console.log("QR:", decodedText);

    if (decodedText.startsWith("https://")) {
      iframe.src = decodedText;
      iframe.style.display = "block";
    } else {
      iframe.style.display = "none";
      resultEl.innerText = "Invalid QR (not a link).";
    }

    qrReader.stop().then(() => {
      scanAgainButton.style.display = "inline-block";
    });
  }

  scanAgainButton.addEventListener('click', () => {
    if (currentCameraId) startScanner(currentCameraId);
  });

  manualSignInButton.addEventListener('click', () => {
    iframe.src = "https://forms.office.com/r/4BJRArLqVB";
    iframe.style.display = "block";
    resultEl.innerText = "Manual Sign-In";

    qrReader.stop().then(() => {
      scanAgainButton.style.display = "inline-block";
    });
  });

  Html5Qrcode.getCameras().then(cameras => {
    cameras.forEach((camera, i) => {
      const option = document.createElement("option");
      option.value = camera.id;
      option.text = camera.label || `Camera ${i + 1}`;
      cameraSelect.appendChild(option);
    });

    currentCameraId = cameras[0].id;
    cameraSelect.value = currentCameraId;
    startScanner(currentCameraId);
  });
</script>

</body>
</html>
